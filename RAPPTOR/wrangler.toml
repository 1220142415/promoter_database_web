name = "rapptor"
account_id = "c5ab8272d65fc83ccb4d3aafa05caf8c"
main = "config/cloudflare-worker.mjs"
compatibility_date = "2026-08-13"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[routes]]
pattern = "rapptor.xulab.science"
zone_name = "xulab.science"
custom_domain = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true
head_sampling_rate = 1

[version_metadata]
binding = "CF_VERSION_METADATA"

[triggers]
crons = ["17 3 * * *", "*/5 * * * *"]

[vars]
RESEND_FROM = "RAPPTOR <no-reply@auth.xulab.science>"
RAPPTOR_EMAILS_PER_DAY = "100"
RAPPTOR_AUTH_EMAILS_PER_ADDRESS_PER_DAY = "10"
RAPPTOR_ANALYTICS = "on"
RAPPTOR_ANALYTICS_PRECISION = "city"
RAPPTOR_USAGE_PUBLIC_PAGE = "on"
RAPPTOR_EXPERIMENTAL_TSS_PUBLIC_PAGE = "on"
RAPPTOR_CATALOG_BACKEND = "d1"
RAPPTOR_PREDICTION_ENABLED = "on"
RAPPTOR_PREDICTION_ACCESS_MODE = "email"
RAPPTOR_PREDICTION_SERVICE_URL = "https://rapptor_server.duolalab.qzz.io"
RAPPTOR_PUBLIC_SITE_URL = "https://rapptor.xulab.science"
RAPPTOR_DEPLOYMENT_ENV = "production"
RAPPTOR_PREDICTION_LOCAL_TEST = "off"
NEXT_PUBLIC_RAPPTOR_PREDICTION_LOCAL_TEST = "off"
NEXT_PUBLIC_RAPPTOR_TURNSTILE_SITE_KEY = "0x4AAAAAAEqH67w5q996rf9C"
RAPPTOR_PREDICTION_MODEL_VERSION = "candidate-github-93cf"
RAPPTOR_PREDICTION_MAX_BASES = "6000000"
RAPPTOR_PREDICTION_SHORT_SEQUENCE_MAX_BASES = "10000"
RAPPTOR_PREDICTION_TICKETS_PER_MINUTE = "2"
RAPPTOR_PREDICTION_GENOME_SCANS_PER_DAY = "5"
RAPPTOR_PREDICTION_BASES_PER_DAY = "12000000"
RAPPTOR_PREDICTION_TICKET_TTL_SECONDS = "120"
RAPPTOR_LOCAL_TEST_TICKETS_PER_MINUTE = "20"
RAPPTOR_LOCAL_TEST_GENOME_SCANS_PER_DAY = "20"
RAPPTOR_LOCAL_TEST_BASES_PER_DAY = "100000000"
UNIFIED_GENOME_ALIASES_JSON = '[{"canonicalAccession":"GCA_000007325.1","predictionAccession":"GCA_000007325.1","experimentalAccession":"GCF_000007325.1","relation":"ncbi_reciprocal"}]'

[[d1_databases]]
binding = "RAPPTOR_DB"
database_name = "seqedge-catalog"
database_id = "e3b0423c-15d2-49c2-823e-5d6ae330910b"
migrations_dir = "database/migrations"
