name = "rapptor"
main = "config/cloudflare-worker.mjs"
compatibility_date = "2026-08-13"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true
head_sampling_rate = 1

[version_metadata]
binding = "CF_VERSION_METADATA"

[triggers]
crons = ["17 3 * * *"]

[vars]
RAPPTOR_ANALYTICS = "on"
RAPPTOR_ANALYTICS_PRECISION = "city"
RAPPTOR_USAGE_PUBLIC_PAGE = "on"
RAPPTOR_EXPERIMENTAL_TSS_PUBLIC_PAGE = "on"
RAPPTOR_CATALOG_BACKEND = "d1"
RAPPTOR_PREDICTION_ENABLED = "on"
RAPPTOR_PREDICTION_SERVICE_URL = "https://rapptor_server.duolalab.qzz.io"
# Temporary local-test branch: no Turnstile widget is rendered.
RAPPTOR_DEPLOYMENT_ENV = "local"
RAPPTOR_PREDICTION_LOCAL_TEST = "on"
NEXT_PUBLIC_RAPPTOR_PREDICTION_LOCAL_TEST = "on"
NEXT_PUBLIC_RAPPTOR_TURNSTILE_SITE_KEY = ""
RAPPTOR_PREDICTION_MODEL_VERSION = "candidate-github-93cf"
RAPPTOR_PREDICTION_MAX_BASES = "6000000"
RAPPTOR_PREDICTION_TICKETS_PER_MINUTE = "2"
RAPPTOR_PREDICTION_BASES_PER_DAY = "12000000"
RAPPTOR_PREDICTION_TICKET_TTL_SECONDS = "120"
UNIFIED_GENOME_ALIASES_JSON = '[{"canonicalAccession":"GCA_000007325.1","predictionAccession":"GCA_000007325.1","experimentalAccession":"GCF_000007325.1","relation":"ncbi_reciprocal"}]'

[[d1_databases]]
binding = "RAPPTOR_DB"
database_name = "rapptor-catalog"
database_id = "13173011-d2b9-4763-b379-ecc1562ef497"
migrations_dir = "database/migrations"
